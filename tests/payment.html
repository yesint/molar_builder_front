<!doctype html><meta charset="utf-8"><title>Payment contract checks</title>
<script type="module">
import { CheckoutDismissed, checkoutBuild, completeCheckout } from "../builder-checkout.js";
const assert = (value, message) => { if (!value) throw new Error(message); };
const popup = () => ({closed: false, location: {replace(url) { this.url = url; }}, close() { this.closed = true; }});
let report;
try {
  const savedOpen = globalThis.open, savedFetch = globalThis.fetch;
  try {
    for (const [outcome, approved] of [["return", true], ["return", false], ["cancel", false]]) {
      const order = "ORDER12345";
      const iframe = document.createElement("iframe");
      const checkout = popup();
      checkout.sessionStorage = sessionStorage;
      checkout.location.replace = () => {
        iframe.src = `../#checkout=${outcome}${approved ? "&order=" + order : ""}`;
        document.body.append(iframe);
      };
      globalThis.open = () => checkout;
      let polls = 0;
      globalThis.fetch = async (url, opts) => {
        assert(opts.headers["X-Builder-Job"]?.length === 64, "The original tab retains the job key");
        if (url.endsWith("/checkout")) return Response.json({order_id: order, url: `https://www.sandbox.paypal.com/checkoutnow?token=${order}`});
        polls++;
        // The popup returns before the signed webhook arrives.
        return Response.json({status: approved ? (polls >= 3 ? "paid" : "pending") :
          outcome === "cancel" ? "pending" : "awaiting_approval"});
      };
      const job = checkoutBuild(async () => ({test: true}));
      if (!approved) {
        let error;
        try { await job; } catch (cause) { error = cause; }
        assert(error instanceof CheckoutDismissed && polls === (outcome === "cancel" ? 1 : 2),
          "Cancellation stops a pending checkout immediately, while a normal return checks approval");
      }
      else { await job; assert(polls >= 3, "The return waits for a verified payment"); }
      assert(checkout.closed && iframe.contentWindow.location.hash === "", "Checkout returned to the builder");
      iframe.remove();
      completeCheckout();
    }
    const originalConfirm = window.confirm;
    try {
      const oldCheckout = popup();
      let confirmedPrice;
      globalThis.open = () => oldCheckout;
      window.confirm = message => { confirmedPrice = message; return false; };
      globalThis.fetch = async () => Response.json({amount: {currency_code: "USD", value: "1.00"}});
      let error;
      try { await checkoutBuild(async () => ({test: true}), "paypal-sandbox", {quotedPrice: "USD 0.50"}); }
      catch (cause) { error = cause; }
      assert(error instanceof CheckoutDismissed && confirmedPrice.includes("USD 1.00") && !oldCheckout.location.url,
        "A previous order at a different price needs confirmation before PayPal opens");
    } finally {
      window.confirm = originalConfirm;
      completeCheckout();
    }
  } finally {
    globalThis.open = savedOpen;
    globalThis.fetch = savedFetch;
  }
  const frame = document.createElement("iframe");
  frame.src = "../#membrane";
  document.body.append(frame);
  const win = frame.contentWindow, el = id => frame.contentDocument.getElementById(id);
  async function waitFor(check) {
    const deadline = performance.now() + 5000;
    while (!check()) {
      if (performance.now() >= deadline) throw new Error("Timed out: " + check);
      await new Promise(resolve => setTimeout(resolve, 20));
    }
  }
  await waitFor(() => el("add-lipid")?.disabled === false && el("assemble-system").textContent.includes("Submit and pay USD"));
  assert(Array.from(el("public-beta-terms").children).every((node, i) =>
    node.isEqualNode(el("submission-fee").children[i])) && el("public-beta-terms").childElementCount === el("submission-fee").childElementCount, "About and Submit show the same beta terms");
  assert(el("assemble-system").textContent.includes("USD 0.50") && el("submission-fee").textContent.includes("USD 0.50"),
    "The submit button and terms show the checkout price");
  const input = (id, value) => {
    el(id).value = value;
    el(id).dispatchEvent(new win.Event("input", {bubbles: true}));
  };
  el("add-lipid").click();
  input("lipid-search", "SOPE");
  frame.contentDocument.querySelector('[data-lipid="SOPE"]').click();
  input("SOPE-inner", "100");
  input("SOPE-outer", "100");
  el("build").click();
  el("continue-solvent").click();
  let polls = 0, keys = [], status, checkoutWindow;
  win.open = () => (checkoutWindow = popup());
  win.fetch = async (url, opts) => {
    if (url.endsWith("/checkout")) {
      keys.push(opts.headers["X-Builder-Job"]);
      return Response.json({amount: {currency_code: "USD", value: "0.50"}, url: "https://www.sandbox.paypal.com/checkoutnow?token=ORDER12345"});
    }
    assert(url.endsWith("/payment-status"), "An unpaid submission must not start a build");
    polls++;
    if (status === "stall") {
      return new Promise((_, reject) => opts.signal.addEventListener("abort", () => reject(opts.signal.reason), {once: true}));
    }
    return Response.json({status});
  };
  for (const leave of ["return", "cancel button", "switch tabs", "close window", "cancel at PayPal", "stop waiting", "cancel during request"]) {
    polls = 0;
    status = leave === "cancel during request" ? "stall" :
      ["cancel at PayPal", "stop waiting"].includes(leave) ? "pending" : "awaiting_approval";
    el("assemble-system").click();
    await waitFor(() => polls === 1 && !el("cancel-checkout").hidden);
    if (status === "pending") {
      assert(el("cancel-checkout").textContent === "Stop waiting", "The confirmation wait can still be stopped");
    }
    if (leave === "cancel button" || leave === "stop waiting") el("cancel-checkout").click();
    else if (leave === "switch tabs") {
      win.dispatchEvent(new win.Event("blur"));
      win.dispatchEvent(new win.Event("focus"));
      await waitFor(() => polls >= 2);
      assert(!checkoutWindow.closed && el("assemble-system").disabled && !el("cancel-checkout").hidden,
        "Switching tabs keeps PayPal open while the order awaits approval");
      el("cancel-checkout").click();
    }
    else if (leave === "close window") checkoutWindow.close();
    else {
      const channel = new BroadcastChannel("molar-paypal-ORDER12345");
      channel.postMessage(leave === "return" ? "return" : "cancel");
      channel.close();
    }
    await waitFor(() => !el("assemble-system").disabled);
    assert(polls === (["return", "switch tabs", "close window"].includes(leave) ? 2 : 1) && el("assembly-progress").hidden && el("assembly-log").hidden,
      "Leaving checkout stops polling and clears progress");
    assert(el("cancel-checkout").hidden && !el("archive-notice").hidden, "The checkout notice replaces the cancel action");
    assert(el("SOPE-inner").value === "100" && el("SOPE-outer").value === "100", "Checkout preserves the build inputs");
  }
  assert(new Set(keys).size === 1, "Retrying the same submission resumes the same order");
  frame.remove();
  report = "PASS: payment authorization, unpaid PayPal returns, checkout cancellation, preserved build inputs and delayed payment confirmation";
} catch (error) { report = `FAIL: ${error.stack || error}`; }
await fetch("/test-result", {method: "POST", body: report});
</script>
