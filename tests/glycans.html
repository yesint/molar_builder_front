<!doctype html><meta charset="utf-8"><title>Glycan browser checks</title>
<iframe id="app" src="../#load" style="width:1250px;height:1000px"></iframe>
<script type="module">
const assert = (value, message) => { if (!value) throw new Error(message); };
const wait = async check => {
  for (let i = 0; i < 400; i++) { if (check()) return; await new Promise(resolve => setTimeout(resolve, 25)); }
  throw new Error("Timed out waiting for glycan editor");
};
let report;
try {
  const frame = document.getElementById("app");
  await wait(() => frame.contentDocument?.getElementById("add-lipid")?.disabled === false);
  const win = frame.contentWindow, doc = frame.contentDocument, $ = id => doc.getElementById(id);
  for (const id of ["load-viewer", "protein-viewer"]) new win.MutationObserver(() => {
    for (const child of $(id).querySelectorAll("iframe")) if (child.getAttribute("src") !== "about:blank") child.src = "about:blank";
  }).observe($(id), {childList:true});
  const loaded = {upload_id:"glycan", partition_id:"glycan", chains:[{id:"A",residues:1}],
    residues:[{id:0,chain:"A",number:56,name:"ASN",protein:true,glycosylatable:true}], ligands:[],ptms:[],ss_bonds:[],structure_url:"/fixture.cif"};
  const originalFetch = win.fetch.bind(win);
  win.fetch = async (url, options) => {
    if (url.endsWith("/glycan")) return originalFetch(url, options);
    if (url.endsWith("/load/structure")) return new win.Response(JSON.stringify(loaded));
    if (url.endsWith("/load/partition")) return new win.Response(JSON.stringify({protein:loaded,ligands:[]}));
    return new win.Response("data_fixture");
  };
  const transfer = new win.DataTransfer(); transfer.items.add(new win.File(["fixture"], "protein.pdb"));
  $("structure-file").files = transfer.files; $("structure-file").dispatchEvent(new win.Event("change"));
  await wait(() => !$("load-options").disabled);
  $("partition-system").click(); await wait(() => !$("load-ready").hidden);
  $("add-ptm").click(); $("ptm-form").requestSubmit();
  assert($("protein-ptms").textContent.includes("ASN A:56") && $("protein-ptms").textContent.includes("GlcNAc"), "A glycan row shows its attachment and IUPAC");
  const viewer = $("protein-viewer").querySelector("iframe");
  $("protein-ptms").querySelector("button").click();
  assert(doc.querySelector('[data-page="ligands"]').getAttribute("aria-disabled") === "true", "No selected ligands disables the Ligands step");
  const ready = () => !$("glycan-apply").disabled;
  await wait(ready);
  assert(!$("glycan-iupac").value.endsWith("-"), "The IUPAC field has no open attachment suffix");
  const count = () => $("glycan-tree").querySelectorAll("[data-node-index]").length;
  assert(count() === 1, "The initial glycan has one clickable SNFG node");
  const positions = id => [...$(id).options].map(option => option.value).join(",");
  assert(positions("glycan-add-position") === "3,4,6", "GlcNAc offers only its hydroxyl acceptor positions");
  assert(positions("glycan-node-donor") === "1", "The selected GlcNAc donor dropdown offers carbon 1");
  $("glycan-add-sugar").value = "Neu5Ac"; $("glycan-add-sugar").dispatchEvent(new win.Event("change"));
  assert(positions("glycan-add-donor") === "2", "Choosing Neu5Ac offers donor carbon 2");
  $("glycan-add-sugar").value = "GlcNAc"; $("glycan-add-sugar").dispatchEvent(new win.Event("change"));
  assert($("glycan-add-donor").value === "1", "Changing the added sugar updates its donor carbon");
  $("glycan-node-anomer").value = "a"; $("glycan-node-anomer").dispatchEvent(new win.Event("change"));
  await wait(() => !$("glycan-error").hidden);
  assert(ready() && $("glycan-node-anomer").value === "b", "An invalid Asn attachment reports the error and restores the valid tree controls");
  const text = "Man(a1-3)[Man(a1-6)]Man(b1-4)GlcNAc(b1-4)GlcNAc";
  $("glycan-iupac").value = text; $("glycan-iupac").dispatchEvent(new win.Event("input"));
  await wait(() => ready() && count() === 5);
  $("glycan-format").click();
  assert($("glycan-iupac").value.includes("[\n  ") && $("glycan-iupac").value.includes("]\n"), "Branches are separated and indented on multiple lines");
  const root = [...$("glycan-tree").querySelectorAll("[data-node-index]")].find(n => n.getAttribute("aria-label").includes("protein attachment"));
  root.dispatchEvent(new win.MouseEvent("click", {bubbles:true}));
  assert(positions("glycan-add-position") === "3,6", "An occupied acceptor is unavailable for another branch");
  assert($("glycan-tree").querySelectorAll(".glycan-selection-outline").length === 1 && root.querySelector(".glycan-selection-outline"), "A visible outline identifies the selected node");
  $("glycan-add-sugar").value = "Fuc"; $("glycan-add-anomer").value = "a"; $("glycan-add-position").value = "6";
  $("glycan-add").click(); await wait(() => ready() && count() === 6);
  assert($("glycan-iupac").value.includes("Fuc(a1-6)"), "Adding an SNFG branch updates IUPAC");
  const fuc = [...$("glycan-tree").querySelectorAll("[data-node-index]")].find(n => n.getAttribute("aria-label").startsWith("Fuc,"));
  fuc.dispatchEvent(new win.KeyboardEvent("keydown", {key:"Enter",bubbles:true}));
  assert(positions("glycan-node-position") === "3,6", "Editing excludes unavailable parent positions but retains this linkage's current position");
  assert($("glycan-tree").querySelectorAll(".glycan-selection-outline").length === 1 && fuc.querySelector(".glycan-selection-outline") && $("glycan-tree").querySelector(".glycan-selected") === fuc, "The selection outline moves to the selected branch");
  const links = [...$("glycan-tree").querySelectorAll("text.link")].map(t => t.textContent);
  assert(links.includes("α1–6") && links.includes("β1–4"), "SNFG labels show both donor and acceptor positions");
  $("glycan-remove").click(); await wait(() => ready() && count() === 5);
  $("glycan-undo").click(); await wait(() => ready() && count() === 6);
  const valid = $("glycan-iupac").value;
  $("glycan-iupac").value = "Man(?1-3)GlcNAc"; $("glycan-iupac").dispatchEvent(new win.Event("input"));
  await wait(() => !$("glycan-error").hidden);
  assert(!ready() && count() === 6, "Invalid linkage text keeps the previous tree visible and blocks Apply");
  $("glycan-iupac").value = valid; $("glycan-iupac").dispatchEvent(new win.Event("input")); await wait(ready);
  for (const [width, height] of [[1024, 650], [1280, 720], [1440, 900]]) {
    frame.style.width = width + "px"; frame.style.height = height + "px";
    const dialog = $("glycan-picker"), box = dialog.getBoundingClientRect();
    assert(dialog.scrollHeight <= dialog.clientHeight + 1 && dialog.scrollWidth <= dialog.clientWidth + 1 &&
      $("glycan-tree").clientHeight >= 80 && $("glycan-apply").getBoundingClientRect().bottom <= box.bottom,
      `The whole glycan editor fits at ${width} × ${height}`);
  }
  $("glycan-apply").click();
  assert(!$("glycan-picker").open && $("protein-ptms").querySelector("code").textContent.includes("Fuc(a1-6)"), "Apply saves the glycan beside the attachment residue");
  assert($("protein-viewer").querySelector("iframe") === viewer, "Editing a glycan preserves the molecular scene");
  const compact = $("protein-ptms").querySelector("code");
  assert(!/\s/.test(compact.textContent) && compact.scrollWidth > compact.clientWidth && win.getComputedStyle(compact).textOverflow === "ellipsis", "Long IUPAC is truncated on one line");
  $("build-protein").click();
  await wait(() => !$("page-membrane").hidden);
  win.location.hash = "#proteins"; await wait(() => !$("page-proteins").hidden);
  $("protein-ptms").querySelector("button").click(); await wait(ready);
  $("glycan-iupac").value = "GlcNAc"; $("glycan-iupac").dispatchEvent(new win.Event("input")); await wait(() => ready() && count() === 1);
  $("glycan-cancel").click();
  assert($("protein-ptms").querySelector("code").textContent.includes("Fuc(a1-6)"), "Cancel preserves the saved glycan");
  loaded.residues[0].name = "SER";
  const secondFile = new win.DataTransfer(); secondFile.items.add(new win.File(["serine"], "serine.pdb"));
  $("structure-file").files = secondFile.files; $("structure-file").dispatchEvent(new win.Event("change"));
  await wait(() => !$("load-options").disabled);
  $("partition-system").click(); await wait(() => !$("load-ready").hidden);
  $("add-ptm").click(); $("ptm-form").requestSubmit();
  $("protein-ptms").querySelector("button").click(); await wait(ready);
  $("glycan-node-anomer").value = "a"; $("glycan-node-anomer").dispatchEvent(new win.Event("change"));
  await wait(() => ready() && $("glycan-attachment").textContent.includes("α1 → OG"));
  assert($("glycan-iupac").value === "GlcNAc", "An alpha protein bond stays outside the IUPAC sequence");
  $("glycan-node-anomer").value = "b"; $("glycan-node-anomer").dispatchEvent(new win.Event("change"));
  await wait(() => ready() && $("glycan-attachment").textContent.includes("β1 → OG"));
  $("glycan-undo").click(); await wait(() => ready() && $("glycan-attachment").textContent.includes("α1 → OG"));
  $("glycan-iupac").value = "Gal(b1-3)GlcNAc"; $("glycan-iupac").dispatchEvent(new win.Event("input"));
  await wait(() => ready() && count() === 2);
  assert($("glycan-attachment").textContent.includes("α1 → OG"), "Editing the sequence retains the alpha protein bond");
  $("glycan-apply").click();
  assert($("protein-ptms").textContent.includes("α1 → OG") && !$("protein-ptms").querySelector("code").textContent.endsWith("-"), "The saved PTM shows its protein bond separately");
  await new Promise(resolve => setTimeout(resolve, 0));
  $("protein-ptms").querySelector("button").click(); await wait(ready);
  assert($("glycan-attachment").textContent.includes("α1 → OG"), "Reopening a saved glycan preserves its root anomer");
  $("glycan-iupac").value = "Neu5Ac(a2-3)Gal(b1-3)GlcNAc"; $("glycan-iupac").dispatchEvent(new win.Event("input"));
  await wait(() => ready() && count() === 3);
  const sialic = [...$("glycan-tree").querySelectorAll("[data-node-index]")].find(n => n.getAttribute("aria-label").startsWith("Neu5Ac,"));
  sialic.dispatchEvent(new win.MouseEvent("click", {bubbles:true}));
  assert($("glycan-node-donor").value === "2" && $("glycan-tree").textContent.includes("α2–3"), "A sialic linkage shows donor carbon 2 in the controls and diagram");
  $("glycan-cancel").click();
  report = "PASS: native IUPAC/SNFG conversion, multiline branches, tree additions/removal, undo, validation, apply/cancel and scene preservation";
} catch (cause) { report = `FAIL: ${cause.stack || cause}`; }
await fetch("/test-result", {method:"POST",body:report});
</script>
