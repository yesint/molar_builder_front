  const details = $("load-ligands").querySelector("details"); details.open = true;
  await wait(() => details.querySelectorAll("input").length === 100);
  assert(details.querySelectorAll("input").length === 100, "Expanded lists use pages without discarding residues");

  assert(details.textContent.includes("L:101"), "All ligand pages remain accessible");
  assert($("load-ready").hidden && $("protein-ready").hidden && $("ligand-ready").hidden, "Loading a new system invalidates all completed steps");
  const extra = { ...loaded, upload_id:"ptm-types", partition_id:"ptm-partition", chains:[{id:"A",residues:3}],
    residues:[{id:0,chain:"A",number:56,name:"ASN",protein:true,glycosylatable:true},
      {id:1,chain:"A",number:35,name:"CYS",protein:true,cysteine:true,lipidatable:true},
      {id:2,chain:"A",number:275,name:"CYS",protein:true,cysteine:true,lipidatable:true}],
    ptms:[], ligands:[], ss_bonds:[{residues:[1,2],distance_nm:.20}] };
  win.fetch = async url => new win.Response(url.endsWith("/load/structure") ? JSON.stringify(extra)
    : url.endsWith("/load/partition") ? JSON.stringify({protein:extra,ligands:[]}) : "data_fixture");
  $("structure-file").files = transfer.files;
  $("structure-file").dispatchEvent(new win.Event("change")); await wait(() => !$("load-options").disabled);
  $("partition-system").click(); await wait(() => !$("protein-options").disabled && !$("load-ready").hidden);
  $("add-ptm").click();
  assert($("ptm-type").value === "glycosylation" && $("ptm-residue").options.length === 1 && $("ptm-residue").value === "0", "Glycosylation offers ASN when no phosphorylatable residues exist");
  assert($("ptm-charge").hidden && $("ptm-charge").disabled, "Only phosphorylation exposes a charge choice");
  $("ptm-form").requestSubmit();
  assert($("protein-ptms").textContent.includes("ASN A:56") && $("protein-ptms").textContent.includes("GlcNAc"), "Glycosylation shows its target residue");
  assert($("add-ptm").disabled, "Disulfide-linked cysteines cannot be palmitoylated");
  $("protein-ss").querySelector("input").click(); $("add-ptm").click();
  assert($("ptm-type").value === "palmitoylation" && $("ptm-residue").options.length === 2, "Unlinked cysteines become available for S-palmitoylation");
  $("ptm-form").requestSubmit();
  assert($("protein-ptms").textContent.includes("CYS A:35, S-palmitoylation") && $("protein-ss").querySelector("input").disabled, "Palmitoylation disables conflicting disulfide choices");
  $("build-protein").click();
  assert(!$("protein-ready").hidden, "Attachment definitions remain deferred until Assembly");
  for (const [type,name,nTerminal] of [
    ["palmitoylation","CYS",false], ["glycine_myristoylation","GLY",true],
    ["lysine_myristoylation","LYS",false], ["farnesylation","CYS",false],
    ["geranylgeranylation","CYS",false], ["triacylation","CYS",true],
    ["glycosylation","ASN",false], ["glycosylation","SER",false], ["glycosylation","THR",false],
  ]) {
    extra.residues=[{id:0,chain:"A",number:1,name,protein:true,n_terminal:nTerminal,
      cysteine:name==="CYS",phosphorylatable:["SER","THR"].includes(name),glycosylatable:["ASN","SER","THR"].includes(name)}];
    extra.ss_bonds=[];extra.chains=[{id:"A",residues:1}];
    const ptmTransfer = new win.DataTransfer(); ptmTransfer.items.add(new win.File(["fixture"], "ptm.pdb"));
    $("structure-file").files = ptmTransfer.files;
    $("structure-file").dispatchEvent(new win.Event("change"));await wait(()=>!$("load-options").disabled);
    $("partition-system").click();await wait(()=>!$("protein-options").disabled && !$("load-ready").hidden);
    const existingFrame=$("protein-viewer").querySelector("iframe");
    $("add-ptm").click();$("ptm-type").value=type;$("ptm-type").dispatchEvent(new win.Event("change"));
    assert(!$("ptm-type").selectedOptions[0].disabled && $("ptm-residue").value==="0",`${type} offers its ${name} target: ${$("ptm-residue").innerHTML}; ${$("protein-ptms").textContent}; ${$("load-error").textContent}`);
    $("ptm-form").requestSubmit();
    assert($("protein-ptms").textContent.includes(name+" A:1") && $("protein-viewer").querySelector("iframe")===existingFrame,`${type} updates controls without rebuilding the scene`);
  }
  extra.residues=[{id:0,chain:"A",number:43,name:"GLY",protein:true,n_terminal:false}];
  const internalTransfer = new win.DataTransfer(); internalTransfer.items.add(new win.File(["fixture"], "internal.pdb"));
  $("structure-file").files = internalTransfer.files;
  $("structure-file").dispatchEvent(new win.Event("change"));await wait(()=>!$("load-options").disabled);
  $("partition-system").click();await wait(()=>!$("protein-options").disabled && !$("load-ready").hidden);
  assert($("add-ptm").disabled,"An internal Gly cannot receive N-terminal myristoylation");
  const unk = {id:0, chain:"E", number:0, name:"UNK", atoms:50, protein:false, preview_index:0};
  const standalone = {...loaded, atoms:50, chains:[], ligands:[], residues:[unk], other:[unk], environment:[]};
  win.fetch = async url => new win.Response(url.endsWith("/load/structure") ? JSON.stringify(standalone) : "data_fixture");
  win.location.hash = "#load";
  const unknownFile = new win.DataTransfer(); unknownFile.items.add(new win.File(["unknown ligand"], "unknown.pdb"));
  $("structure-file").files = unknownFile.files; $("structure-file").dispatchEvent(new win.Event("change"));
  await wait(() => !$("load-options").disabled);
  const standaloneFrame = $("load-viewer").querySelector("iframe"), files = [];
  standaloneFrame.contentWindow.postMessage = data => files.push(data);
  win.dispatchEvent(new win.MessageEvent("message", {origin:win.location.origin,source:standaloneFrame.contentWindow,data:{type:"ready"}}));
  assert(files[0]?.protein === "" && files[0].ligands === "resindex 0" && files[0].ligandStyle === "ballstick",
    "A standalone unknown ligand opens in ball-and-stick representation");
  const checkbox = $("load-ligands").querySelector("input");
  assert(checkbox.checked && !checkbox.closest("details"), "The standalone ligand is selected in the visible residue list");
  checkbox.click();
  assert(files.at(-1).ligands === "", "The user can explicitly deselect the standalone ligand");
  const {setLigands, ligandState} = await win.eval('import("/protein.js")');
  const waters = Array.from({length:7}, (_, i) => ({residue:{name:"HOH", atoms:3, number:i+1, chain:"A"}, structure_url:`/water/${i}`}));
  setLigands(waters);
  assert($("prepared-ligands").textContent === "HOH (7)" && !$("prepared-ligands").querySelector("button, details")
    && ligandState.items.length === 7, "Seven retained waters have one summary and preserve all seven assembly inputs");
  ligandState.sources = waters.map(item => ({item}));
  const {invalidateAssembly} = await win.eval('import("/assembly.js")');
  invalidateAssembly();
  assert($("submit-summary").textContent.includes("Parameterize ligands (HOH ×7)"),
    "The submission summary counts repeated water molecules once");
  report = "PASS: protein controls, deferred batch order, margin sizing, no-membrane assembly, failure/retry, global Orient, modifications, handoff, grouped large inventories, environment summaries, and resindex labels";
} catch (error) { report = `FAIL: ${error.stack || error}`; }
await fetch("/test-result", {method:"POST",body:report});
</script>
